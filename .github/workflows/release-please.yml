name: release-please

# Automatic release on the default branch. release-please opens a release
# pull request from conventional commits, then on merge tags vX.Y.Z and
# creates the GitHub release. It does not publish to the Bend hub itself: a
# caller that publishes adds a `publish` job after it (publish.yml), run only
# when release_created is true, with the tag_name output as its tag.
#
# Caller:
#   name: release-please
#   on:
#     push:
#       branches: [main] # or master
#   permissions:
#     contents: write
#     pull-requests: write
#     issues: write
#     actions: write
#   jobs:
#     release-please:
#       permissions:
#         contents: write
#         pull-requests: write
#         issues: write
#         actions: write
#       uses: Emerging-Patterns/actions/.github/workflows/release-please.yml@main
#       with:
#         ci-workflow: ci.yml
#
# The caller must grant actions: write (workflow and job), since this job
# requests it; a caller that does not gets a startup failure.
#
# ci-workflow runs the caller's CI on the release pull request. release-please
# pushes the release branch with github.token, and GitHub starts no workflow
# for an event github.token caused, so the release pull request never gets the
# required check and cannot merge. workflow_dispatch is the exception, and a
# required check is matched by name on the head commit, whatever event ran it.
# So, with ci-workflow set (e.g. ci.yml), after release-please this job finds
# every open release pull request against the target branch (the ones
# release-please created or updated this run, from its prs output, and any it
# left unchanged) and runs `gh workflow run <ci-workflow> --ref <branch>` for
# each head commit that has no run of that workflow yet. The caller's
# ci-workflow must list workflow_dispatch under on:, and its check job must
# keep the name the ruleset requires (check / check for a `check` job that
# calls nix-flake-check.yml). Empty (default) is off.
#
# Leave release-type empty and commit .github/release-please-config.json plus
# .github/release-please-manifest.json. Those paths are the defaults, so a
# thin caller needs no with: block. Pass config-file and manifest-file only
# to override them. For flake.nix, set the package release-type to go and
# list flake.nix under extra-files (see README). simple rewrites version.txt.
# node updates package.json. A non-empty release-type input ignores
# config-file and manifest-file.
# Squash-merge the release pull request, as the org's main rulesets require.
# release-please finds the merged release pull request by its label and tags
# the commit it landed as (ezhttp v0.19.0-v0.21.0 were released this way).
# tag.yml remains the manual workflow_dispatch bump. Do not also run
# github-release.yml for tags this workflow creates.

on:
  workflow_call:
    inputs:
      release-type:
        description: "Built-in strategy. Empty (default) loads config-file so extra-files can version flake.nix. simple and node do not. Non-empty ignores config-file and manifest-file."
        required: false
        type: string
        default: ""
      config-file:
        description: "Path to release-please config. Used when release-type is empty."
        required: false
        type: string
        default: ".github/release-please-config.json"
      manifest-file:
        description: "Path to the version manifest. Used when release-type is empty."
        required: false
        type: string
        default: ".github/release-please-manifest.json"
      target-branch:
        description: "Branch to open the release PR against. Empty uses the repository default branch."
        required: false
        type: string
        default: ""
      ci-workflow:
        description: "Caller CI workflow file (e.g. ci.yml) to dispatch on each open release PR head that has no run of it yet. Needs workflow_dispatch in that workflow and actions: write from the caller. Empty (default) is off."
        required: false
        type: string
        default: ""
    secrets:
      token:
        description: "Optional token for the release PR and GitHub release. Empty uses github.token. A PAT retriggers workflows."
        required: false
    outputs:
      releases_created:
        description: "true if any GitHub release was created"
        value: ${{ jobs.release-please.outputs.releases_created }}
      release_created:
        description: "true if the root component was released"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "Root component tag, when a release was created"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "Root component version, when a release was created"
        value: ${{ jobs.release-please.outputs.version }}
      sha:
        description: "Commit SHA the root release was tagged at"
        value: ${{ jobs.release-please.outputs.sha }}
      html_url:
        description: "GitHub release URL for the root component"
        value: ${{ jobs.release-please.outputs.html_url }}

concurrency:
  group: release-please-${{ github.repository }}-${{ inputs.target-branch }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      html_url: ${{ steps.release.outputs.html_url }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.token || github.token }}
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}

      # release-please pushes with github.token, which starts no workflow, so
      # dispatch the caller's CI on each release branch head that lacks a run.
      # Every run checks, not only when prs_created is true: release-please
      # leaves a pull request whose notes did not change untouched (no prs
      # output), and one opened before ci-workflow was set still needs a run.
      - name: ci on the release pull request
        if: inputs.ci-workflow != ''
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          GH_REPO: ${{ github.repository }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          target="${TARGET_BRANCH:-$(gh repo view "$GH_REPO" --json defaultBranchRef --jq .defaultBranchRef.name)}"
          prefix="release-please--branches--${target}"
          {
            printf '%s' "${PRS:-[]}" | jq -r '.[].headBranchName'
            gh pr list --state open --base "$target" --json headRefName \
              | jq -r --arg p "$prefix" '.[].headRefName | select(. == $p or startswith($p + "--"))'
          } | sort -u | while read -r branch; do
            [ -n "$branch" ] || continue
            sha=$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha 2>/dev/null) || {
              echo "$branch: no such branch"
              continue
            }
            # GitHub records the pull_request event github.token caused as a
            # run with conclusion action_required that never ran a job, so
            # count only runs that are running or ran (cancelled and stale
            # ones get a fresh dispatch).
            # shellcheck disable=SC2016 # $c is a jq variable
            runs=$(gh api "repos/$GH_REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$sha&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion as $c | ["action_required", "cancelled", "stale", "skipped"] | index($c) | not)] | length')
            if [ "$runs" -gt 0 ]; then
              echo "$branch ($sha): $CI_WORKFLOW already ran"
            else
              echo "$branch ($sha): dispatching $CI_WORKFLOW"
              # The dispatch reads the workflow file on the release branch, so
              # a release branch cut before the caller added workflow_dispatch
              # gets HTTP 422 until release-please next rewrites the branch
              # or someone updates it from the target branch. Warn and go on:
              # failing here would fail the release-please job.
              gh workflow run "$CI_WORKFLOW" --repo "$GH_REPO" --ref "$branch" ||
                echo "::warning::$branch: could not dispatch $CI_WORKFLOW. If its copy on that branch lacks workflow_dispatch, update the branch from $target."
            fi
          done
